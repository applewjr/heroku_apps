{# Wordle's and Antiwordle's board CSS. The page sets the colors on :root:
   --color-1, --color-2 and --color-3 for the three tile colors, and
   --smart-assign-on for the Smart Assign button when it's on. #}
<style>
#wordle-grid .wordle-row {
    display: flex;
    justify-content: center;
    position: relative;
    width: fit-content;
    margin: 0 auto;
}

#wordle-grid .wordle-box {
    width: 60px;
    height: 60px;
    font-size: 22px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 5px;
    border: 2px solid #777;
    transition: background-color 0.3s;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

/* Define color states */
.color-0 { background-color: #fff; }
.color-1 { background-color: var(--color-1); }
.color-2 { background-color: var(--color-2); }
.color-3 { background-color: var(--color-3); }

#wordle-grid .wordle-box.color-1,
#wordle-grid .wordle-box.color-2,
#wordle-grid .wordle-box.color-3 {
    color: #fff;
    border-color: transparent;
}

.row-clear {
    position: absolute;
    right: -36px;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
    border: 1px solid #ddd;
    border-radius: 50%;
    background-color: #f8f9fa;
    color: #888;
    font-size: 16px;
    line-height: 1;
    padding: 0;
    cursor: pointer;
    visibility: hidden;
    -webkit-tap-highlight-color: transparent;
}
.row-clear:hover {
    background-color: #e9ecef;
    color: #d9534f;
}
.wordle-row.has-content .row-clear {
    visibility: visible;
}

.confirm-clear {
    position: absolute;
    top: 50%;
    right: 0;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 6px;
    background-color: #fff;
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 6px 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    z-index: 20;
    white-space: nowrap;
}
.confirm-clear span {
    font-size: 13px;
    color: #333;
}
.confirm-clear button {
    border: none;
    border-radius: 5px;
    padding: 5px 10px;
    font-size: 13px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}
.confirm-clear .confirm-yes {
    background-color: #d9534f;
    color: #fff;
}
.confirm-clear .confirm-no {
    background-color: #e9ecef;
    color: #333;
}

#solver-keyboard {
    max-width: 500px;
    margin: 18px auto 0;
    padding: 0 8px;
    user-select: none;
    -webkit-user-select: none;
}
.kb-row {
    display: flex;
    justify-content: center;
    gap: 5px;
    margin-bottom: 6px;
}
.kb-key {
    flex: 1;
    max-width: 44px;
    height: 50px;
    border: none;
    border-radius: 4px;
    background-color: #d3d6da;
    color: #1a1a1a;
    font-size: 15px;
    font-weight: 600;
    padding: 0;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 0.15s ease;
}
.kb-key:active {
    background-color: #b8bcc0;
}
.kb-key.kb-wide {
    max-width: 66px;
    flex: 1.5;
    font-size: 18px;
}
.kb-key.key-color-1 { background-color: var(--color-1); color: #fff; }
.kb-key.key-color-2 { background-color: var(--color-2); color: #fff; }
.kb-key.key-color-3 { background-color: var(--color-3); color: #fff; }

.legend-box.color-1 { background-color: var(--color-1) !important; }
.legend-box.color-2 { background-color: var(--color-2) !important; }
.legend-box.color-3 { background-color: var(--color-3) !important; }

.instructions {
    background-color: #f8f9fa;
    border-radius: 8px;
    margin: 20px auto;
    max-width: 600px;
    font-size: 14px;
    border: 1px solid #e9ecef;
    overflow: hidden;
}
.instructions-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 15px;
    cursor: pointer;
    user-select: none;
}
.instructions-header:hover {
    background-color: #e9ecef;
}
.instructions-toggle-icon {
    font-size: 11px;
    color: #888;
    transition: transform 0.2s ease;
}
.instructions-body {
    padding: 0 15px 15px 15px;
}
.instructions.collapsed .instructions-body {
    display: none;
}
.instructions.collapsed .instructions-toggle-icon {
    transform: rotate(-90deg);
}

#wordle-grid .wordle-row.active-row .wordle-box {
    border-color: #02484d;
}

.color-legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 15px 0;
    flex-wrap: wrap;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
}

.legend-box {
    width: 20px;
    height: 20px;
    border: 1px solid #777;
    border-radius: 3px;
}

.browse-button {
    background-color: #02484d;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    text-align: center;
}
.browse-button:hover {
    background-color: #03282b;
    color: gray;
}

.suggestion-btn {
    background-color: #f8f9fa;
    color: #495057;
    border: 1px solid #dee2e6;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 2px;
    transition: all 0.15s ease;
    display: inline-block;
    margin: 4px;
}
.suggestion-btn:hover {
    background-color: #02484d;
    color: white;
    border-color: #02484d;
}
.suggestion-btn.alt-pick {
    background-color: #f0f4ff;
    border-color: #c5d0e8;
}
.suggestion-label {
    font-size: 12px;
    color: #888;
    display: block;
    margin-bottom: 2px;
    letter-spacing: 0;
    font-weight: normal;
}
#recommendations {
    margin: 10px 0;
    transition: opacity 0.15s ease;
    position: relative;
}
#recommendations.loading {
    opacity: 0.5;
    pointer-events: none;
}
#recommendations-status {
    margin: 6px auto 0;
    font-size: 12px;
    color: #888;
    letter-spacing: 0.3px;
    text-align: center;
    visibility: hidden;
}
#recommendations-status.visible {
    visibility: visible;
}
.options-remaining {
    display: block;
    width: fit-content;
    margin: 10px auto 0;
    padding: 5px 14px;
    background-color: #f0f0f0;
    border: 1px solid #ddd;
    border-radius: 20px;
    font-size: 12px;
    color: #555;
    letter-spacing: 0.3px;
}

#smart-assign-toggle {
    background-color: #f8f9fa;
    color: #495057;
    border: 1px solid #ccc;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s ease;
    user-select: none;
    position: relative;
}
#smart-assign-toggle.active {
    background-color: var(--smart-assign-on);
    color: white;
    border-color: var(--smart-assign-on);
}
#smart-assign-toggle .tooltip {
    visibility: hidden;
    opacity: 0;
    background-color: #333;
    color: #fff;
    text-align: left;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 12px;
    line-height: 1.5;
    width: 230px;
    position: absolute;
    top: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    transition: opacity 0.15s ease;
    pointer-events: none;
}
#smart-assign-toggle:hover .tooltip {
    visibility: visible;
    opacity: 1;
}

@media (max-width: 768px) {
    .browse-button {
        flex: 1 0 46%;
        margin: 5px;
        padding: 10px;
    }

    #buttons-container {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: space-around;
    }

    .color-legend {
        flex-direction: column;
        align-items: center;
        gap: 10px;
    }
}

@media (max-width: 480px) {
    #wordle-grid .wordle-box {
        width: 48px;
        height: 48px;
        margin: 3px;
        font-size: 20px;
    }

    .kb-key {
        height: 46px;
        font-size: 14px;
    }
}

@media (max-width: 360px) {
    #wordle-grid .wordle-box {
        width: 44px;
        height: 44px;
    }

    .row-clear {
        right: -32px;
    }
}
</style>
