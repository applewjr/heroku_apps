name: CI

# Run the test suite on every push to any branch (feature branches included),
# so you get a green/red signal right after `git push`, before you deploy.
on:
  push:
  workflow_dispatch:   # manual "Run" button

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # secret_pass.py does not exist in CI; config.py falls back to these.
      SESSION_KEY: ci-test-session-key

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest
