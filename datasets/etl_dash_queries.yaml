# The /etl_dash panels, one page per round, in file order. The daily digest
# (monitoring/daily_digest.py) mails every panel too. Each query must be a
# SELECT; the views live in mysql_views/dashboard/. Round names are in
# data.py (ETL_ROUND_NAMES), because every key in this file is read as a panel.

Traffic Today:
    round: 1
    label: "Traffic Today"
    description: "Human landings today against the usual by this time of day (the last 7 days' average). vs_usual_pct is the difference; min_since_last is minutes since the latest landing"
    query: SELECT * FROM vw_prod_traffic_today;

Landings (14 Days):
    round: 1
    label: "Landings (14 Days)"
    description: "Human landings per page per day. Today is partial"
    query: SELECT * FROM vw_prod_word_solver_page_visits;

Errors by Day:
    round: 1
    label: "Errors by Day"
    description: "server_errors are 500s and should be 0. not_found are 404s, nearly all scanners, so only a jump matters"
    query: SELECT * FROM vw_prod_errors_by_day;

Server Errors (Last 7 Days):
    round: 1
    label: "Server Errors (Last 7 Days)"
    description: "The latest 500s, newest first. Empty is good"
    query: SELECT * FROM vw_prod_errors;

Recent Feedback:
    round: 1
    label: "Recent Feedback"
    description: "Feedback form posts from the last 30 days, newest first (vw_prod_dynamic_1)"
    query: SELECT * FROM vw_prod_dynamic_1;


Weekly Landings:
    round: 2
    label: "Weekly Landings"
    description: "Human landings per page per week, Monday to Sunday. This week is partial"
    query: SELECT * FROM vw_prod_weekly_landings;

Search Sources:
    round: 2
    label: "Search Sources"
    description: "Each page's human landings, last 7 days against the 7 before: Google's share, the change in Google landings, other search engines, and no referrer (direct)"
    query: SELECT * FROM vw_prod_search_sources;

Solver to Solver:
    round: 2
    label: "Solver to Solver"
    description: "Visits that came from one of this site's pages to a solver, last 7 days against the 7 before. home is the front page; the rest show whether the More daily puzzle solvers cards move players between games"
    query: SELECT * FROM vw_prod_internal_flow;


Blossom:
    round: 3
    label: "Blossom"
    description: "Click counts by current time PST, total day, minmax. Last 28 days"
    query: SELECT * FROM vw_prod_blossom;

Blossom Most Recent:
    round: 3
    label: "Blossom Most Recent"
    description: "Most recent 25 clicks"
    query: SELECT * FROM vw_prod_blossom_most_recent;

Blossom Hourly Average:
    round: 3
    label: "Blossom Hourly Average"
    description: "Clicks averaged by hour, last 28 days"
    query: SELECT * FROM vw_prod_blossom_hourly_average;

Blossom Search Source:
    round: 3
    label: "Blossom Search Source"
    description: "Referrer sources, minmaxed"
    query: SELECT * FROM vw_prod_blossom_search_source;


High Level ETL:
    round: 4
    label: 'High Level ETL'
    description: "Min and max dates for various ETL"
    query: SELECT * FROM vw_prod_high_level_etl;

Youtube Trending:
    round: 4
    label: 'Youtube Trending'
    description: "Last 10 days of data"
    query: SELECT * FROM vw_prod_youtube_trending;

Youtube Trending Grouped:
    round: 4
    label: 'Youtube Trending Grouped'
    description: "Last 10 days of data for the new grouped Youtube trending"
    query: SELECT * FROM vw_prod_youtube_trending_grouped;


Dynamic View 1:
    round: 5
    label: 'Dynamic View 1'
    description: ""
    query: SELECT * FROM vw_prod_dynamic_1;

Dynamic View 2:
    round: 5
    label: 'Dynamic View 2'
    description: ""
    query: SELECT * FROM vw_prod_dynamic_2;

Dynamic View 3:
    round: 5
    label: 'Dynamic View 3'
    description: ""
    query: SELECT * FROM vw_prod_dynamic_3;

Dynamic View 4:
    round: 5
    label: 'Dynamic View 4'
    description: ""
    query: SELECT * FROM vw_prod_dynamic_4;
