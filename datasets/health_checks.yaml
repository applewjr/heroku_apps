# Health checks, run hourly from a one-off dyno by monitoring/run_checks.py.
#
# Each entry runs its SQL, takes the first column of the first row as the
# measured value, and compares it against `threshold` using `compare`. A breach
# prints one JJ_ALERT line, which Papertrail turns into an email.
#
# SQL lives here rather than in mysql_views/ on purpose: a check then deploys
# atomically with the code, with no manual DDL step to forget. The dashboard
# views are different - humans run those in Workbench too.
#
# Keys:
#   sql               required. Returns one row; the first column is the value.
#   threshold         required. Compared against that value.
#   compare           one of ">=", "<=", ">", "<", "==", "!=" (default ">=")
#   sev               crit, warn or info (default warn)
#   only_between_pst  [start, end] inclusive PST hours; skipped outside them
#   description       why the check exists; included in the alert


##### daily ETL loads #####

# The scheduler runs these at 12am PST. Checking from 2am leaves the job time
# to land, and re-checking every hour after that means a late failure is still
# caught rather than missed by a single daily probe.

youtube_trending_today:
    sev: crit
    description: "Daily youtube_trending load, scheduler 12am PST"
    compare: ">="
    threshold: 45
    only_between_pst: [2, 23]
    sql: |
        SELECT COUNT(*)
        FROM youtube_trending
        WHERE collected_date = DATE(CONVERT_TZ(NOW(), 'UTC', 'America/Los_Angeles'));

youtube_grouped_today:
    sev: crit
    description: "Daily youtube_trending_revamp load, scheduler 12am PST"
    compare: ">="
    threshold: 125
    only_between_pst: [2, 23]
    sql: |
        SELECT COUNT(*)
        FROM youtube_trending_revamp
        WHERE collected_date = DATE(CONVERT_TZ(NOW(), 'UTC', 'America/Los_Angeles'));


##### traffic gone quiet #####

# Two checks asking different questions. site_idle asks "is anyone reaching the
# site at all", which catches an outage that still answers 200 to a prober -
# DNS, Cloudflare, a delisting. blossom_idle asks "is anyone actually solving",
# which catches a site serving perfectly while the thing people come for is
# broken.
#
# Both are plain "minutes since the last one" rules. Neither is hour-of-day
# aware and the history says neither needs to be: traffic is broadly uniform,
# which is what an internationally visited solver looks like. There is no 4am
# lull to protect against.
#
# blossom_idle still carries an hour-of-day CASE that never fires. Measured
# 2026-09-26: every hour averages at least 5 non-probe clicks over 28 days
# (quietest 8pm at 5.6, busiest 5am at 37.5), so the `< 5` test always fails
# and the gate never closes. Its threshold was set from the measured gap
# distribution rather than from the gate, so the check is correctly calibrated
# for what it actually does - the CASE is dead weight, not a bug. Left in place
# because removing it would change behaviour precisely when blossom traffic
# collapsed, which is the one moment you want this check unchanged.
#
# smush_idle was deleted 2026-09-28. Its gate had the opposite defect: it never
# opened, so the check always returned 0, could never fail, and still counted
# as a pass in the tally - a green light wired to nothing. Reaching its gate
# needed 84 hits in one hour-of-day across 28 days. Two things replaced it,
# both strictly better: site_idle below, and the web:smush probe in
# health_web.yaml, which fetches the page and asserts it rendered. A probe
# catches a broken smush within the hour no matter how much traffic smush
# happens to be getting, which no threshold on one page can do. Measured the
# same day: smush went from 8 visits on 09-25 to 537 on 09-27, so any
# per-page threshold set now would be calibrated against a moving target.
#
# Probe traffic is excluded everywhere, and this is load-bearing. run_checks
# fetches several pages every hour as 'jj-healthcheck', and those GETs write
# app_visits rows. A check counting them would be held quiet by its own prober
# forever - the same failure the blossom must_have/may_have exclusion guards
# against, which is why vw_prod_blossom.sql excludes that one too.
#
# Obvious bots are excluded from site_idle as well. Measured 2026-09-28 over 90
# days, dropping them moves the longest observed quiet stretch from 73 minutes
# to 116: crawlers were genuinely filling real gaps, so counting them would let
# a polite 15-minute crawler hold the check quiet through a total collapse in
# human traffic. Detection is a substring list, not a library - Werkzeug 3
# dropped its UA parser - so it catches crawlers that announce themselves and
# misses scrapers posing as Chrome. Treat it as "excludes the obvious".
#
# Indexed as of 2026-09-24: app_visits on (submit_time) and on
# (page_name, submit_time), blossom_solver_clicks on (click_time).
#
# site_idle bounds itself to the last day so the regex only ever runs over a
# few hundred rows through the (submit_time) index, not the whole table. That
# bound also makes the COALESCE meaningful: no rows at all in 24 hours yields
# NULL, which becomes 99999 and breaches, which is the correct answer.
# blossom_idle instead walks the primary key backwards, because its probe
# exclusion filters on must_have/may_have, which no index covers.

blossom_idle:
    sev: warn
    description: "Blossom solver has had no real clicks in hours"
    compare: "<="
    # 240 measured, not guessed. Replaying this check hourly over the 11,900
    # non-probe clicks in the trailing 28 days (2026-09-26):
    #
    #     threshold   alerts/28d   per week
    #      60 (was)       70         17.5     <- 10.4% of all runs
    #      90             28          7.0
    #     120              7          1.8
    #     180              1          0.2
    #     240              0          0
    #
    # The longest genuine quiet stretches were 185, 177, 148 and 143 minutes -
    # ordinary overnight-and-weekend variation, not outages. At 60 this fired
    # roughly 2.5 times a day, which is how an alert inbox stops being read.
    #
    # Four hours is acceptable because this is a backstop, not a front line:
    # the web:* probes catch a dead or slow dyno within the hour, and http_500 and
    # log_drain_failed catch the specific mechanisms. This only exists for the
    # case where everything looks healthy but nobody is actually solving.
    #
    # Re-measure before tightening. The simulation is cheap: pull 28 days of
    # click_time, replay at hourly points, count breaches per candidate.
    threshold: 240
    sql: |
        SELECT CASE
                 WHEN COALESCE(hourly_avg, 0) < 5 THEN 0
                 ELSE COALESCE(mins_since, 99999)
               END AS idle_minutes
        FROM (
            SELECT
                (SELECT COUNT(*) / 28
                   FROM blossom_solver_clicks
                  WHERE HOUR(click_time) = HOUR(CONVERT_TZ(NOW(), 'UTC', 'America/Los_Angeles'))
                    AND click_time >= CONVERT_TZ(NOW(), 'UTC', 'America/Los_Angeles') - INTERVAL 28 DAY
                    AND NOT (must_have = 'a' AND may_have = 'qwerty')) AS hourly_avg,
                TIMESTAMPDIFF(MINUTE,
                    (SELECT click_time
                       FROM blossom_solver_clicks
                      WHERE NOT (must_have = 'a' AND may_have = 'qwerty')
                      ORDER BY id DESC LIMIT 1),
                    CONVERT_TZ(NOW(), 'UTC', 'America/Los_Angeles')) AS mins_since
        ) AS m;

site_idle:
    sev: warn
    description: "Nobody has reached any logged page in hours"
    compare: "<="
    # 180 measured, not guessed. Replaying this check hourly over 90 days of
    # app_visits (2026-09-28), with the probe and obvious bots excluded:
    #
    #     threshold   breaches/90d   % of runs
    #      60             27            1.3%
    #      90              3            0.1%
    #     120              0            0
    #     180              0            0
    #     240              0            0
    #
    # The longest genuine quiet stretch across 90 days was 116 minutes, against
    # a baseline of ~205 non-bot visits a day. 180 clears the worst real gap by
    # half again and has never fired on real history.
    #
    # Re-measure before tightening, and re-measure after any change to which
    # routes call log_page_visit - only the solver pages do today, so this is
    # "anyone on a solver page", not literally every request.
    threshold: 180
    sql: |
        SELECT COALESCE(
                 TIMESTAMPDIFF(MINUTE,
                     (SELECT MAX(submit_time)
                        FROM app_visits
                       WHERE submit_time >= CONVERT_TZ(NOW(), 'UTC', 'America/Los_Angeles') - INTERVAL 1 DAY
                         AND user_agent <> 'jj-healthcheck'
                         AND NOT (LOWER(user_agent) REGEXP 'bot|crawl|spider|slurp|facebookexternalhit|bingpreview|python-requests|curl|wget|headless|scrapy|semrush|ahrefs|petal|bytespider')),
                     CONVERT_TZ(NOW(), 'UTC', 'America/Los_Angeles')),
                 99999) AS idle_minutes;


##### errors #####

# This reads real data again now that 500s are logged by app.py's exception
# handler and referred 404s by the catch-all in routes/misc.py. Before that it
# counted rows nothing wrote.
#
# There is deliberately no daily 500 counter here. app.py emits http_500 the
# moment an exception is handled, throttled to once per 15 minutes, which is
# both faster and quieter than an hourly count would be - an hourly check that
# breached at 9am would email every hour until midnight.

blossom_errors_today:
    sev: warn
    description: "Error pages served to blossom visitors today"
    compare: "<="
    threshold: 10
    sql: |
        SELECT COUNT(*)
        FROM app_visits
        WHERE page_name LIKE '%error%'
          AND referrer LIKE '%blossom%'
          AND submit_time >= DATE(CONVERT_TZ(NOW(), 'UTC', 'America/Los_Angeles'));


##### JawsDB capacity #####

# Leopard Shared meters exactly two things: 1 GB of storage and 15 concurrent
# connections. Queries and I/O are unmetered, so these are the only two
# resources that can actually run out.

db_size_mb:
    sev: warn
    description: "JawsDB Leopard Shared storage, 1 GB limit"
    compare: "<="
    threshold: 700
    # Checked twice a day, not hourly. Storage moves at ~20 MB a month, so a
    # breach takes months to resolve - and the Papertrail rule emails on any
    # JJ_ALERT within 10 minutes, so an hourly check would send an email every
    # hour for weeks and bury the alerts that need same-day attention.
    #
    # The window was [9, 9] - a single hour, so the 09:00 PST run evaluated it
    # and no other. That is one point of failure away from no coverage at all:
    # scheduler drift, a dyno that fails to start, or one run that dies on an
    # earlier check, and the day is silently skipped. The failure is invisible,
    # because a skipped check looks exactly like a passing one in the tally.
    # Two hours costs a second email a day while a breach is open and buys a
    # free retry every day it is not.
    #
    # 700 leaves 324 MB free, comfortably more than the largest table (~133 MB)
    # needs for a DELETE + OPTIMIZE rebuild, so every remediation stays
    # available. At ~260 MB/year that is roughly 14 months of notice, about
    # four months more than 800 gave.
    only_between_pst: [9, 10]
    sql: |
        SELECT ROUND(SUM(data_length + index_length) / 1024 / 1024)
        FROM information_schema.tables
        WHERE table_schema = DATABASE();

db_connections:
    sev: warn
    description: "JawsDB Leopard Shared connections, 15 limit"
    compare: "<="
    threshold: 13
    sql: SELECT COUNT(*) FROM information_schema.processlist;


##### the Redis to MySQL drain #####

# redis_wordle.py moves wordle and antiwordle logging out of Redis nightly and
# deletes the stream only when the row counts reconcile. If it stops, rows stop
# arriving here. Thresholds are generous on purpose: these tables also go quiet
# when nobody happens to play, so tighten only after watching real numbers.

